# fly.io deploy config (free tier: 1x shared-cpu 256 MB machine + 1 GB volume).
# The agent is a plain Node HTTP server; no sleep (min_machines_running = 1)
# because the rules forfeit tasks when the agent is offline.
app = "absaa-gatekeeper"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "gatekeeper_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
